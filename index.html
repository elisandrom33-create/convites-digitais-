<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Convite Digital Interativo</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;1,600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
    .font-serif-title { font-family: 'Playfair Display', serif; }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col items-center justify-center p-4">

  <!-- TELA 1: FORMULÁRIO DE CRIAÇÃO DO CONVITE -->
  <div id="tela-criacao" class="w-full max-w-md bg-slate-900 border border-slate-800 rounded-3xl p-6 shadow-2xl hidden">
    <div class="text-center mb-6">
      <span class="text-xs uppercase tracking-widest text-emerald-400 font-semibold">Convite Digital Premium</span>
      <h1 class="font-serif-title text-3xl text-white mt-1">Crie seu Convite</h1>
      <p class="text-slate-400 text-sm mt-1">Preencha os dados e libere o link interativo via Pix.</p>
    </div>

    <form id="form-convite" class="space-y-4">
      <div>
        <label class="block text-xs font-medium text-slate-300 mb-1">Tipo de Evento</label>
        <select id="tipo" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-emerald-500">
          <option value="Aniversário">🎂 Aniversário</option>
          <option value="Casamento">💍 Casamento</option>
          <option value="Chá de Bebê">🍼 Chá de Bebê</option>
          <option value="Formatura">🎓 Formatura</option>
          <option value="Confraternização">🥂 Confraternização</option>
        </select>
      </div>

      <div>
        <label class="block text-xs font-medium text-slate-300 mb-1">Nome do(s) Anfitrião(ões)</label>
        <input type="text" id="anfitriao" required placeholder="Ex: Sofia & Isabelle / João Silva"
          class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-emerald-500" />
      </div>

      <div class="grid grid-cols-2 gap-3">
        <div>
          <label class="block text-xs font-medium text-slate-300 mb-1">Data</label>
          <input type="date" id="data" required
            class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-emerald-500" />
        </div>
        <div>
          <label class="block text-xs font-medium text-slate-300 mb-1">Horário</label>
          <input type="time" id="hora" required
            class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-emerald-500" />
        </div>
      </div>

      <div>
        <label class="block text-xs font-medium text-slate-300 mb-1">Local / Endereço</label>
        <input type="text" id="local" required placeholder="Ex: Salão de Festas Atrium, Rua..."
          class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-emerald-5
